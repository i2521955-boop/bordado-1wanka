{% load static %}<a href="/producto/{{ p.slug }}/" class="tarjeta group bg-white rounded-2xl overflow-hidden border border-stone-200 shadow-sm hover:shadow-lg transition flex flex-col">
  <div class="aspect-square overflow-hidden bg-wanka-50"><img src="{{ p.imagen_principal|default:'/static/img/artesania.svg' }}" alt="{{ p.nombre }}" class="img-zoom w-full h-full object-cover rounded-t-[10px]"></div>
  <div class="p-4 flex-1 flex flex-col">
    <p class="text-xs uppercase tracking-wider text-andino font-bold">{{ p.categoria }}</p>
    <h3 class="font-serif text-lg mt-1 group-hover:text-wanka-600">{{ p.nombre }}</h3>
    <div class="mt-auto pt-3 flex items-center justify-between">
      <span class="text-wanka-600 font-bold text-lg">S/ {{ p.precio_desde|floatformat:2 }}</span>
      {% if p.tipo_fabricacion != 'stock' %}<span class="text-xs bg-oro/20 text-amber-800 px-2 py-1 rounded-full">A pedido</span>
      {% elif p.disponible %}<span class="text-xs bg-emerald-50 text-emerald-700 px-2 py-1 rounded-full">Disponible</span>
      {% else %}<span class="text-xs bg-stone-100 text-stone-500 px-2 py-1 rounded-full">Agotado</span>{% endif %}
    </div>
  </div>
</a>
