{% if messages %}<div class="max-w-7xl mx-auto px-4 mt-4 space-y-2">{% for m in messages %}
<div class="rounded-lg px-4 py-3 text-sm border {% if m.tags == 'error' %}bg-red-50 border-red-200 text-red-800{% elif m.tags == 'success' %}bg-emerald-50 border-emerald-200 text-emerald-800{% elif m.tags == 'warning' %}bg-amber-50 border-amber-200 text-amber-800{% else %}bg-sky-50 border-sky-200 text-sky-800{% endif %}">{{ m }}</div>
{% endfor %}</div>{% endif %}
